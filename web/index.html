<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NAS Music TV · 为电视而生的开源多源音乐播放器</title>
    <meta
      name="description"
      content="NAS Music TV 是开源的 Android 音乐播放器（TV / 手机 / 平板通用）：聚合 Jellyfin、Navidrome、Subsonic、道理鱼、飞牛等 NAS 后端与网络音乐、百度网盘，支持逐字卡拉OK歌词、K 歌伴奏、MTV、天气电台、27 套可视化特效与 70 种照片墙转场。"
    />
    <meta
      name="keywords"
      content="NAS Music TV,Android TV 音乐播放器,卡拉OK歌词,NAS 音乐,Jellyfin,Navidrome,Subsonic,百度网盘音乐,MTV,天气电台,可视化特效,照片墙,浅色主题"
    />
    <meta name="theme-color" content="#06070e" />
    <!--
      多语言：React 挂载前预设 <html lang>，避免刷新时闪烁。
      优先级与 src/i18n/store.ts 一致：URL ?lang=en > localStorage > 浏览器语言。
      分享链接示例：<任意页面>?lang=en 直达英文版，?lang=zh 直达中文版。
    -->
    <script>
      (function () {
        try {
          var lang = null;
          var param = new URLSearchParams(window.location.search).get("lang");
          if (param) {
            var v = param.trim().toLowerCase().replace(/_/g, "-");
            if (v === "zh" || v === "zh-cn" || v === "cn" || v === "chinese") lang = "zh-CN";
            else if (v === "en" || v === "en-us" || v === "english") lang = "en-US";
          }
          if (!lang) lang = localStorage.getItem("nasmusictv.lang");
          if (lang !== "zh-CN" && lang !== "en-US") {
            lang = (navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh-CN" : "en-US";
          }
          document.documentElement.lang = lang;
        } catch (e) {
          /* 隐私模式等场景保持静态默认值 */
        }
      })();
    </script>
    <meta property="og:title" content="NAS Music TV · 为电视而生的开源多源音乐播放器" />
    <meta
      property="og:description"
      content="聚合 NAS、网络音乐与百度网盘多音乐源，支持逐字卡拉OK歌词、K 歌伴奏、MTV、天气电台、27 套可视化特效与照片墙 70 种转场，同一 APK 适配电视与手机。"
    />
    <meta property="og:type" content="website" />
    <!-- 社交分享封面：不单独提供 00-share-cover.png，直接复用首页仪表盘截图（自托管于 /screens/01-dashboard.jpg） -->
    <meta
      property="og:image"
      content="/screens/01-dashboard.jpg"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="/screens/01-dashboard.jpg"
    />
    <!--
      百度统计（hm.js）：全站唯一埋点入口。
      本项目是 React Router SPA，页面切换不触发整页加载，hm.js 默认只上报首屏 PV，
      因此额外加载官方 UrlChangeTracker 插件监听 pushState / popstate，按路由上报 PV。

      注意事项：
      1. _requirePlugin 全站只能调用一次，多余调用无效。
      2. 不要在百度统计后台再开启「管理 → 单页应用设置」，否则会重复上报。
      3. UrlChangeTracker 故意不采集 replaceState。本项目目前所有跳转均为 pushState
         （router.tsx 无 replace / <Navigate replace>），若将来引入 replace 跳转需改为
         手动 _trackPageview 上报。
    -->
    <script>
      var _hmt = _hmt || [];
      (function () {
        var hm = document.createElement("script");
        hm.src =
          "https://hm.baidu.com/hm.js?dedffde230c3027148520cf301ea680b";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
      // SPA 路由变更跟踪（官方文档：
      // https://tongji.baidu.com/web/help/article?id=324&type=0）
      _hmt.push([
        "_requirePlugin",
        "UrlChangeTracker",
        {
          shouldTrackUrlChange: function (newPath, oldPath) {
            // 忽略仅 query/hash 变化（如 ?from=xxx），避免重复 PV
            return newPath && oldPath && newPath.split("?")[0] !== oldPath.split("?")[0];
          },
        },
      ]);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
